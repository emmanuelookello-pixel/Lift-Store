{% extends 'admin_management_base.html' %}{% block page_title %}{{ 'Edit' if area else 'Add' }} delivery area{% endblock %}
{% block management %}<h1>{{ 'Edit' if area else 'Add' }} delivery area</h1><form class="panel fields" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Area name<input name="name" maxlength="120" required value="{{ request.form.get('name',area.name if area else '') }}"></label><label>Delivery fee (UGX)<input type="number" name="fee" min="0" max="2147483647" step="1" required value="{{ request.form.get('fee',area.fee if area else 0) }}"></label><label class="check"><input type="checkbox" name="active" {% if (request.form.get('active') == 'on' if request.method == 'POST' else (area.active if area else true)) %}checked{% endif %}>Active at checkout</label><div class="actions"><button>Save delivery area</button><a href="{{ url_for('admin_delivery_areas') }}">Cancel</a></div></form>{% endblock %}
