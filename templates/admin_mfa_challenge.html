<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify admin sign-in | Lift Store</title><style>body{font:16px system-ui;background:#edf3fb;color:#17263c;margin:0;padding:30px}main{max-width:420px;margin:8vh auto;background:white;padding:32px;border-radius:16px}input,button{display:block;box-sizing:border-box;width:100%;padding:14px;margin:16px 0;border-radius:6px;border:1px solid #ccd6e4;font:inherit}button{background:#0866df;color:white;border:0}a{color:#0866df}</style></head><body><main><h1>Verify your sign-in</h1><p>Enter the current code from your authenticator app, or one of your recovery codes.</p>{% for message in get_flashed_messages() %}<p role="status">{{ message }}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="code">Authenticator or recovery code</label><input id="code" name="code" autocomplete="one-time-code" maxlength="20" required autofocus><button>Verify and sign in</button></form><a href="{{ url_for('admin_logout') }}">Cancel sign-in</a></main></body></html>
