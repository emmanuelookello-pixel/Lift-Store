<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in | Lift Store</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fb;color:#14243b;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:440px;padding:36px;background:white;border:1px solid #d8e4f2;border-radius:16px;box-shadow:0 18px 50px #17355812}.logo{width:170px;height:auto}.eyebrow{color:#0766d9;font-size:12px;letter-spacing:.12em;font-weight:700;margin-top:24px}h1{font-size:28px;margin:10px 0}p{color:#5f7087;line-height:1.6}label{display:block;font-weight:600;font-size:14px;margin-top:20px}input{width:100%;padding:13px;border:1px solid #c9d7e9;border-radius:7px;margin-top:8px;font:inherit}button{width:100%;padding:14px;background:#0867df;color:white;border:0;border-radius:7px;margin-top:26px;font:inherit;font-weight:600;cursor:pointer}.message{padding:12px;background:#edf4ff;border-radius:7px}a{color:#0964d5}</style></head><body><main class="card"><img class="logo" src="{{ url_for('static',filename='images/lift-store-logo.png') }}" alt="Lift Store"><div class="eyebrow">ADMINISTRATION</div><h1>Admin sign in</h1><p>Manage your store, products and orders.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="message" role="status">{{ message }}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="admin-email">Administrator email</label><input id="admin-email" type="email" name="email" autocomplete="username" required><label for="admin-password">Password</label><input id="admin-password" type="password" name="password" autocomplete="current-password" required><button>Sign in to admin</button></form><p><a href="{{ url_for('home') }}">View customer store</a></p></main></body></html>
