{% extends 'base.html' %}{% block content %}<section class="sf-wrap sf-customer-profile"><div class="sf-profile-panel"><span class="sf-eyebrow">YOUR LIFT STORE ACCOUNT</span><h1>Welcome back</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email or phone number<input name="identity" autocomplete="username" placeholder="Email or +256 phone number" required maxlength="150"></label><label>Password<input type="password" name="password" autocomplete="current-password" minlength="8" maxlength="128" required></label><button class="sf-button">Sign in</button></form><p><a href="{{ url_for('account_recovery') }}">Forgot your password?</a></p><p><a href="{{ url_for('register') }}">New here? Create an account</a></p></div></section>{% endblock %}
