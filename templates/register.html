{% extends 'base.html' %}{% block content %}<section class="sf-wrap sf-customer-profile"><div class="sf-profile-panel"><span class="sf-eyebrow">YOUR LIFT STORE ACCOUNT</span><h1>Create your account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" autocomplete="name" maxlength="100" required></label><label>Email or phone number<input name="identity" autocomplete="username" placeholder="Email or +256 phone number" required maxlength="150"></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="sf-button">Create account</button></form><p><a href="{{ url_for('login') }}">Already registered? Sign in</a></p></div></section>{% endblock %}
